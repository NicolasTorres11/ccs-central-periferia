openapi: 3.0.3
info:
  title: CCS Central API
  version: 1.0.0
  description: >
    APIs de la central CCS para recepcion de emergencias, administracion de reglas,
    consulta de vehiculos, gestion de propietarios e ingesta HTTP de telemetria.

servers:
  - url: https://api.ccs.example/v1
    description: Produccion
  - url: https://api-stg.ccs.example/v1
    description: Staging

tags:
  - name: Emergency
  - name: Rules
  - name: Vehicles
  - name: Owners
  - name: Telemetry

security:
  - oauth2: []

paths:
  /emergency:
    post:
      tags: [Emergency]
      summary: Reportar una emergencia o boton de panico
      operationId: reportEmergency
      security:
        - oauth2: [emergency.write]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencySignal'
            examples:
              panic:
                value:
                  deviceId: DEV-001234
                  type: Panic
                  source: PhysicalButton
                  gps:
                    lat: 4.711
                    lng: -74.072
                  timestamp: '2026-05-12T14:23:10Z'
      responses:
        '202':
          description: Emergencia aceptada para despacho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /rules:
    get:
      tags: [Rules]
      summary: Listar reglas del propietario autenticado
      operationId: listRules
      security:
        - oauth2: [rules.read]
      parameters:
        - name: vehicleId
          in: query
          schema:
            type: string
            format: uuid
        - name: eventType
          in: query
          schema:
            $ref: '#/components/schemas/EventType'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reglas paginadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rules]
      summary: Crear regla
      operationId: createRule
      security:
        - oauth2: [rules.write]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
      responses:
        '201':
          description: Regla creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Rules]
      summary: Obtener regla por identificador
      operationId: getRule
      security:
        - oauth2: [rules.read]
      responses:
        '200':
          description: Regla encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Rules]
      summary: Actualizar regla
      operationId: updateRule
      security:
        - oauth2: [rules.write]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdate'
      responses:
        '200':
          description: Regla actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Rules]
      summary: Eliminar regla
      operationId: deleteRule
      security:
        - oauth2: [rules.write]
      responses:
        '204':
          description: Regla eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  /vehicles:
    get:
      tags: [Vehicles]
      summary: Listar vehiculos
      operationId: listVehicles
      security:
        - oauth2: [vehicles.read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Vehiculos paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'

  /vehicles/{vehicleId}/state:
    get:
      tags: [Vehicles]
      summary: Obtener estado actual del vehiculo
      operationId: getVehicleState
      security:
        - oauth2: [vehicles.read]
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleState'
        '404':
          $ref: '#/components/responses/NotFound'

  /owners:
    post:
      tags: [Owners]
      summary: Crear propietario
      operationId: createOwner
      security:
        - oauth2: [owners.admin]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
      responses:
        '201':
          description: Propietario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          $ref: '#/components/responses/BadRequest'

  /telemetry/ingest:
    post:
      tags: [Telemetry]
      summary: Ingesta HTTP de telemetria para dispositivos sin MQTT
      operationId: ingestTelemetry
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/TelemetryMessage'
      responses:
        '202':
          description: Lote aceptado
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Payload demasiado grande
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 64
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Solicitud invalida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No autenticado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto de concurrencia
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite de tasa excedido
      headers:
        Retry-After:
          schema:
            type: integer
    ServiceUnavailable:
      description: Servicio degradado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    EventType:
      type: string
      enum: [Panic, DriverDistress, UnplannedStop, OverSpeed, OutOfSchedule, TempOutOfRange, Accident, GeofenceExit, GeofenceEnter]

    ActionType:
      type: string
      enum: [Sms, Email, Push, AuthorityCall, WebhookOwner, BroadcastDashboard]

    Gps:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180

    EmergencySignal:
      type: object
      required: [deviceId, type, timestamp]
      properties:
        deviceId:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/EventType'
        source:
          type: string
          enum: [PhysicalButton, MobileApp, AutoDetection]
        reason:
          type: string
          maxLength: 200
        gps:
          $ref: '#/components/schemas/Gps'
        timestamp:
          type: string
          format: date-time

    EmergencyAccepted:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
        receivedAt:
          type: string
          format: date-time

    Rule:
      allOf:
        - $ref: '#/components/schemas/RuleCreate'
        - type: object
          properties:
            ruleId:
              type: string
              format: uuid
            ownerId:
              type: string
              format: uuid
            etag:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    RuleCreate:
      type: object
      required: [name, eventType, actions]
      properties:
        vehicleId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 3
          maxLength: 200
        eventType:
          $ref: '#/components/schemas/EventType'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        conditionJson:
          type: string
        isActive:
          type: boolean
          default: true
        actions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RuleAction'

    RuleUpdate:
      allOf:
        - $ref: '#/components/schemas/RuleCreate'

    RuleAction:
      type: object
      required: [actionType, targetType, targetReference]
      properties:
        actionType:
          $ref: '#/components/schemas/ActionType'
        targetType:
          type: string
          enum: [Owner, Driver, Authority, Custom]
        targetReference:
          type: string
          maxLength: 500
        order:
          type: integer
          minimum: 1
          default: 1
        isCritical:
          type: boolean
          default: false

    RulePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        nextCursor:
          type: string
          nullable: true

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        vehicleType:
          type: string
          enum: [Truck, Car, Motorcycle, Taxi, Bus]
        plate:
          type: string
        deviceId:
          type: string
        status:
          type: string
          enum: [Active, Maintenance, Inactive]

    VehiclePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        nextCursor:
          type: string
          nullable: true

    VehicleState:
      type: object
      properties:
        deviceId:
          type: string
        vehicleId:
          type: string
          format: uuid
        online:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
        gps:
          $ref: '#/components/schemas/Gps'
        speedKmh:
          type: number
        temperatureC:
          type: number
        engineStatus:
          type: string
          enum: [On, Off, Unknown]

    Owner:
      type: object
      properties:
        ownerId:
          type: string
          format: uuid
        documentType:
          type: string
          enum: [CC, NIT, CE]
        documentNumber:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneE164:
          type: string
        status:
          type: string
          enum: [Active, Suspended, Cancelled]

    OwnerCreate:
      type: object
      required: [documentType, documentNumber, fullName]
      properties:
        documentType:
          type: string
          enum: [CC, NIT, CE]
        documentNumber:
          type: string
          minLength: 4
          maxLength: 50
        fullName:
          type: string
          minLength: 3
          maxLength: 200
        email:
          type: string
          format: email
        phoneE164:
          type: string
          pattern: '^\\+[1-9]\\d{6,14}$'

    TelemetryMessage:
      type: object
      required: [deviceId, ts]
      properties:
        deviceId:
          type: string
        ts:
          type: string
          format: date-time
        gps:
          $ref: '#/components/schemas/Gps'
        speedKmh:
          type: number
        headingDeg:
          type: number
        temperatureC:
          type: number
        engineStatus:
          type: string
          enum: [On, Off, Unknown]
        fuelPct:
          type: number
          minimum: 0
          maximum: 100
        eventType:
          type: string
          default: telemetry

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  securitySchemes:
    oauth2:
      type: oauth2
      description: Microsoft Entra ID con Authorization Code + PKCE
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes:
            emergency.write: Reportar emergencias
            rules.read: Leer reglas
            rules.write: Crear o modificar reglas
            vehicles.read: Leer vehiculos
            owners.admin: Administrar propietarios
    mtls:
      type: mutualTLS
      description: mTLS para dispositivos IoT con certificado X.509
