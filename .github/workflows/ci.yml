name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CCS.slnx

      - name: Test
        run: dotnet test CCS.slnx --configuration Release --no-restore --collect:"XPlat Code Coverage" --settings coverlet.runsettings

